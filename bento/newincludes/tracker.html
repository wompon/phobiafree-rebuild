<script>
(function () {
  // Remember ad/campaign attribution (last touch) so the consult booking can
  // report which keyword/campaign paid for it. Survives navigation between pages.
  try {
    var _aq = new URLSearchParams(window.location.search || '');
    if (_aq.get('gclid') || _aq.get('utm_source')) {
      localStorage.setItem('pf_attr', JSON.stringify({
        gclid: _aq.get('gclid') || '',
        utm_source: _aq.get('utm_source') || '',
        utm_medium: _aq.get('utm_medium') || '',
        utm_campaign: _aq.get('utm_campaign') || '',
        utm_term: _aq.get('utm_term') || '',
        utm_content: _aq.get('utm_content') || '',
        landing: window.location.pathname || '/',
        ts: new Date().toISOString()
      }));
    }
  } catch (e) {}

  if (window.location.search.indexOf('notrack=1') !== -1) return;
  // Automation/headless browsers (Selenium, Playwright, Puppeteer, most crawlers)
  // set navigator.webdriver. Never track them — they're bots, not visitors.
  if (navigator.webdriver) return;

  var vid = sessionStorage.getItem('pfvid') || '';
  if (!vid) {
    vid = 'v_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now().toString(36);
  }
  sessionStorage.setItem('pfvid', vid);

  var path = (window.location.pathname || '/').replace(/\.html$/i, '').replace(/\/$/, '') || '/';
  var parts = path.split('/').filter(Boolean);
  var page = parts.length ? parts[parts.length - 1] : 'home';

  var mx = 0.5, my = 0.5, lastSent = 0, pendingEvents = [];
  // Idle detection: a tab left open with no interaction shouldn't stay "live"
  // on /visitors forever. After IDLE_MS of no mouse/scroll/touch/keyboard, we
  // stop pinging and drop the visitor; any real interaction brings them back.
  var IDLE_MS = 120000;
  var lastActivity = Date.now();
  var idleLeft = false;
  // A visitor doesn't count as "live" until they actually do something (move,
  // scroll, tap, click, type) — OR until they've already done that earlier in
  // this browser tab session. Once proven human on any page, later pages in the
  // same session (e.g. switching phobias via the consult modal) start pinging
  // immediately so a quiet stare still shows on /visitors. Cold bots, prerenders,
  // and first-ever landings still need a real interaction.
  var INTERACT_KEY = 'pf_interacted';
  var hasInteracted = false;
  try { hasInteracted = sessionStorage.getItem(INTERACT_KEY) === '1'; } catch (e) {}
  // Monotonic ping generation across same-tab navigations. Leave beacons from
  // the previous page can arrive AFTER the next page's first ping; without this
  // the leave would wipe the fresh live card (looks like "/services broke it").
  var GEN_KEY = 'pf_gen';
  var pingGen = 0;
  try { pingGen = parseInt(sessionStorage.getItem(GEN_KEY) || '0', 10) || 0; } catch (e) {}
  function nextGen() {
    pingGen += 1;
    try { sessionStorage.setItem(GEN_KEY, String(pingGen)); } catch (e) {}
    return pingGen;
  }
  function markActivity() {
    lastActivity = Date.now();
    idleLeft = false;
    hasInteracted = true;
    try { sessionStorage.setItem(INTERACT_KEY, '1'); } catch (e) {}
  }
  var ua = navigator.userAgent, device = 'Desktop';
  if (/iPhone|iPod/.test(ua)) device = 'iPhone';
  else if (/iPad/.test(ua)) device = 'iPad';
  else if (/Android/.test(ua) && /Mobile/.test(ua)) device = 'Android Phone';
  else if (/Android/.test(ua)) device = 'Android Tablet';
  else if (/Macintosh/.test(ua)) device = 'Mac';
  else if (/Windows/.test(ua)) device = 'Windows';

  function getViewport() {
    if (window.visualViewport) {
      return {
        w: Math.round(window.visualViewport.width),
        h: Math.round(window.visualViewport.height)
      };
    }
    return { w: window.innerWidth, h: window.innerHeight };
  }

  function isModalTarget(el) {
    var t = el;
    while (t && t !== document && t !== document.body) {
      try {
        var oc = (t.getAttribute && t.getAttribute('onclick')) || '';
        if (oc.indexOf('openModal') !== -1) return true;
        if (t.classList && (t.classList.contains('btn-book') || t.classList.contains('nav-cta'))) {
          if (oc.indexOf('openModal') !== -1 || (t.getAttribute('href') || '').indexOf('modal=1') !== -1) {
            return true;
          }
        }
      } catch (e) {}
      t = t.parentElement;
    }
    return false;
  }

  function selectorFor(el) {
    // Build a path selector unique enough for the /visitors mirror to find the
    // SAME element. A bare tag ('a') used to resolve to the first anchor on the
    // page — the nav brand link — making the mirror navigate to /my_fear.
    try {
      if (!el || !el.tagName) return '';
      var path = [], t = el, depth = 0;
      while (t && t.tagName && t.tagName !== 'HTML' && depth < 6) {
        if (t.id) {
          path.unshift('#' + ((window.CSS && CSS.escape) ? CSS.escape(t.id) : t.id));
          break;
        }
        var seg = t.tagName.toLowerCase();
        var p = t.parentElement;
        if (p) {
          var kids = p.children, n = 0, idx = 0;
          for (var i = 0; i < kids.length; i++) {
            if (kids[i].tagName === t.tagName) { n++; if (kids[i] === t) idx = n; }
          }
          if (n > 1) seg += ':nth-of-type(' + idx + ')';
        }
        path.unshift(seg);
        if (t.tagName === 'BODY') break;
        t = p; depth++;
      }
      return path.join('>');
    } catch (e) {
      return '';
    }
  }

  window.pfTrackPush = function (ev) {
    if (!ev || typeof ev !== 'object') return;
    pendingEvents.push(ev);
    send();
  };

  document.addEventListener('mousemove', function (e) {
    mx = e.clientX / window.innerWidth;
    my = e.clientY / window.innerHeight;
    markActivity();
  });

  document.addEventListener('click', function (e) {
    markActivity();
    var vp = getViewport();
    pendingEvents.push({
      type: 'click',
      x: Math.round((e.clientX / vp.w) * 1000) / 1000,
      y: Math.round(Math.max(0, Math.min(1, e.clientY / vp.h)) * 1000) / 1000,
      modal: isModalTarget(e.target),
      selector: selectorFor(e.target)
    });
    send();
  });

  var firstLoad = Math.floor(Date.now() / 1000);
  var modalScrollBound = false;

  function getModalBox() {
    var modal = document.getElementById('consultModal');
    if (!modal || !modal.classList.contains('active')) return null;
    return modal.querySelector('.modal-box');
  }

  function getInvBox() {
    var m = document.getElementById('investmentModal');
    if (!m || !m.classList.contains('active')) return null;
    return m.querySelector('.modal-box');
  }

  function getScrollMetrics() {
    var box = getModalBox();
    if (box) {
      var sh = box.scrollHeight - box.clientHeight;
      var sp = sh > 0 ? Math.round((box.scrollTop / sh) * 1000) / 1000 : 0;
      return {
        scrollY: Math.round(box.scrollTop || 0),
        scrollPct: sp,
        modalScroll: true,
        section: 'consult-modal'
      };
    }
    // Pricing modal open (and consult not on top): report ITS inner scroll so
    // the mirror scrolls the modal, not the page frozen behind it.
    var invBox = getInvBox();
    if (invBox) {
      var ish = invBox.scrollHeight - invBox.clientHeight;
      var isp = ish > 0 ? Math.round((invBox.scrollTop / ish) * 1000) / 1000 : 0;
      return {
        scrollY: Math.round(invBox.scrollTop || 0),
        scrollPct: isp,
        modalScroll: false,
        section: page
      };
    }
    var pageSh = document.documentElement.scrollHeight - window.innerHeight;
    var pageSp = pageSh > 0 ? Math.round((window.scrollY / pageSh) * 1000) / 1000 : 0;
    return {
      scrollY: window.scrollY,
      scrollPct: pageSp,
      modalScroll: false,
      section: page
    };
  }

  function bindModalScroll() {
    var box = getModalBox();
    if (box && !box._pfScrollBound) {
      box._pfScrollBound = true;
      box.addEventListener('scroll', send, { passive: true });
      modalScrollBound = true;
    }
    var im = document.getElementById('investmentModal');
    var ibox = im && im.querySelector('.modal-box');
    if (ibox && !ibox._pfScrollBound) {
      ibox._pfScrollBound = true;
      ibox.addEventListener('scroll', send, { passive: true });
    }
  }

  window.pfTrackAttachModalScroll = function () {
    bindModalScroll();
    send();
  };

  // Force an immediate ping, bypassing the 150ms throttle. Called when the modal
  // opens/closes so the live mirror reflects that state change right away instead
  // of waiting for the next heartbeat.
  window.pfTrackFlush = function () {
    markActivity();
    lastSent = 0;
    send();
  };

  // FAQ accordions (<details class="faq">): send which ones are open so /visitors
  // can mirror the dropdown state the same way it mirrors the booking modal.
  function getOpenFaqs() {
    var open = [];
    var faqs = document.querySelectorAll('details.faq');
    for (var i = 0; i < faqs.length; i++) {
      if (faqs[i].open) open.push(i);
    }
    return open;
  }

  // Consult modal "What is your phobia or fear?"
  // Native OS pickers can't be mirrored (no hover/scroll events). Open an
  // in-page listbox instead so selected row + list scroll are real DOM state.
  var cfPhobiaOpen = false;
  var cfPhobiaScroll = 0;
  var cfPhobiaHoverIdx = -1;
  function getCfPhobiaSel() {
    return document.getElementById('cf_phobia');
  }
  function getCfPhobia() {
    var sel = getCfPhobiaSel();
    if (!sel || sel.selectedIndex < 0) return '';
    var opt = sel.options[sel.selectedIndex];
    return (opt && (opt.getAttribute('data-slug') || opt.value)) || '';
  }
  function getCfPhobiaIdx() {
    var sel = getCfPhobiaSel();
    return sel ? sel.selectedIndex : -1;
  }
  function openCfPhobiaList(sel) {
    if (!sel) return;
    var n = Math.min(sel.options.length, 10);
    sel.size = n;
    sel.classList.add('pf-phobia-open');
    cfPhobiaOpen = true;
    cfPhobiaHoverIdx = -1;
    paintCfPhobiaHighlight(sel);
    try { sel.scrollIntoView({ block: 'nearest' }); } catch (e) {}
  }
  function closeCfPhobiaList(sel) {
    if (!sel) return;
    sel.size = 1;
    sel.classList.remove('pf-phobia-open');
    cfPhobiaOpen = false;
    cfPhobiaScroll = 0;
    cfPhobiaHoverIdx = -1;
    paintCfPhobiaHighlight(sel);
  }
  // Paint hover vs committed selection separately — never change selectedIndex
  // on mousemove (that made "close modal" redirect to the last hovered fear).
  function paintCfPhobiaHighlight(sel) {
    if (!sel) return;
    var open = sel.size > 1;
    var selected = sel.selectedIndex;
    var hover = cfPhobiaHoverIdx;
    for (var i = 0; i < sel.options.length; i++) {
      var opt = sel.options[i];
      if (open && i === selected) {
        opt.style.background = '#c5e4e0';
        opt.style.color = '#0c1b24';
        opt.style.fontWeight = '600';
      } else if (open && i === hover) {
        opt.style.background = '#e8f5f3';
        opt.style.color = '#0c1b24';
        opt.style.fontWeight = '';
      } else {
        opt.style.background = '';
        opt.style.color = '';
        opt.style.fontWeight = '';
      }
    }
  }
  function bindCfPhobia() {
    var sel = getCfPhobiaSel();
    if (!sel || sel._pfBound) return;
    sel._pfBound = true;
    function flushPhobia() {
      paintCfPhobiaHighlight(sel);
      markActivity();
      if (typeof window.pfTrackFlush === 'function') window.pfTrackFlush();
      else send();
    }
    function syncScroll() {
      cfPhobiaScroll = sel.scrollTop || 0;
    }
    function commitOption(idx) {
      if (typeof idx !== 'number' || idx < 0 || idx >= sel.options.length) return;
      if (sel.selectedIndex !== idx) sel.selectedIndex = idx;
      cfPhobiaHoverIdx = -1;
      syncScroll();
      closeCfPhobiaList(sel);
      flushPhobia();
    }
    // Expand in-page (skip OS dropdown) so highlight + scroll are trackable.
    sel.addEventListener('mousedown', function (e) {
      if (sel.size <= 1) {
        e.preventDefault();
        openCfPhobiaList(sel);
        sel.focus();
        flushPhobia();
        return;
      }
      // List already open — commit the option under the cursor on press.
      var t = e.target;
      if (t && t.tagName === 'OPTION' && typeof t.index === 'number') {
        e.preventDefault();
        commitOption(t.index);
      }
    });
    sel.addEventListener('touchend', function (e) {
      if (sel.size <= 1) {
        e.preventDefault();
        openCfPhobiaList(sel);
        sel.focus();
        flushPhobia();
        return;
      }
      var t = e.target;
      if (t && t.tagName === 'OPTION' && typeof t.index === 'number') {
        e.preventDefault();
        commitOption(t.index);
      }
    }, { passive: false });
    sel.addEventListener('focus', function () {
      if (sel.size <= 1) openCfPhobiaList(sel);
      cfPhobiaOpen = true;
      flushPhobia();
    });
    sel.addEventListener('scroll', function () {
      syncScroll();
      flushPhobia();
    }, { passive: true });
    sel.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        commitOption(sel.selectedIndex);
        return;
      }
      setTimeout(function () {
        syncScroll();
        flushPhobia();
      }, 0);
    });
    sel.addEventListener('input', function () {
      syncScroll();
      flushPhobia();
    });
    // Hover paints only — does NOT change the committed selection.
    sel.addEventListener('mousemove', function (e) {
      if (sel.size <= 1) return;
      var t = e.target;
      if (!t || t.tagName !== 'OPTION') return;
      var i = t.index;
      if (typeof i === 'number' && i >= 0 && cfPhobiaHoverIdx !== i) {
        cfPhobiaHoverIdx = i;
        paintCfPhobiaHighlight(sel);
      }
    });
    sel.addEventListener('mouseleave', function () {
      if (cfPhobiaHoverIdx === -1) return;
      cfPhobiaHoverIdx = -1;
      paintCfPhobiaHighlight(sel);
    });
    sel.addEventListener('change', function () {
      syncScroll();
      cfPhobiaHoverIdx = -1;
      closeCfPhobiaList(sel);
      flushPhobia();
    });
    sel.addEventListener('blur', function () {
      setTimeout(function () {
        if (document.activeElement === sel) return;
        closeCfPhobiaList(sel);
        flushPhobia();
      }, 180);
    });
  }

  document.addEventListener('toggle', function (e) {
    var t = e.target;
    if (!t || !t.classList || !t.classList.contains('faq')) return;
    markActivity();
    if (typeof window.pfTrackFlush === 'function') window.pfTrackFlush();
    else send();
  }, true);

  // Chrome may PRERENDER this page (speculative load when a link is hovered or
  // the URL is typed). A prerender runs all our JS/timers invisibly, so without
  // this guard it pings /track and shows up as a "phantom" visitor on /visitors
  // until Chrome discards it. Never ping while prerendering; we ping on activation.
  function isPrerendering() {
    return document.prerendering === true || document.visibilityState === 'prerender';
  }

  function adsMeta() {
    var q = new URLSearchParams(window.location.search || '');
    return {
      gclid: q.get('gclid') || '',
      utm_source: q.get('utm_source') || '',
      utm_medium: q.get('utm_medium') || '',
      utm_campaign: q.get('utm_campaign') || '',
      utm_term: q.get('utm_term') || '',
      utm_content: q.get('utm_content') || '',
      referrer: document.referrer || '',
      path: window.location.pathname || '/'
    };
  }

  // Record EVERY landing once — even if they never move the mouse — so Ads
  // clicks can be reconciled against real page loads (ghost hits included).
  var hitSent = false;
  function sendPageHit(interactedFlag) {
    if (isPrerendering()) return;
    if (hitSent) return;
    hitSent = true;
    var payload = Object.assign({
      vid: vid,
      page: page,
      device: device,
      hit: 1,
      interacted: interactedFlag ? 1 : 0
    }, adsMeta());
    try {
      var body = JSON.stringify(payload);
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/track?hit=1', new Blob([body], { type: 'application/json' }));
      } else {
        fetch('/track?hit=1', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: body,
          keepalive: true
        }).catch(function () {});
      }
    } catch (e) {}
  }

  function send() {
    if (isPrerendering()) return;
    if (!hasInteracted) return;
    var now = Date.now();
    if (now - lastSent < 150) return;
    lastSent = now;
    bindModalScroll();
    bindCfPhobia();
    var vp = getViewport();
    var sm = getScrollMetrics();
    var eventsToSend = pendingEvents.splice(0);
    var chat = (typeof window.pfGetChatState === 'function') ? window.pfGetChatState() : null;
    var gen = nextGen();
    fetch('/track', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        vid: vid,
        gen: gen,
        x: Math.round(mx * 1000) / 1000,
        y: Math.round(my * 1000) / 1000,
        scrollY: sm.scrollY,
        scrollPct: sm.scrollPct,
        modalScroll: sm.modalScroll,
        openFaqs: getOpenFaqs(),
        cfPhobia: getCfPhobia(),
        cfPhobiaOpen: cfPhobiaOpen ? 1 : 0,
        cfPhobiaIdx: getCfPhobiaIdx(),
        cfPhobiaScroll: Math.round(cfPhobiaScroll) || 0,
        invOpen: (function () {
          var inv = document.getElementById('investmentModal');
          return inv && inv.classList.contains('active') ? 1 : 0;
        })(),
        navOpen: (function () {
          var nv = document.getElementById('nav');
          return nv && nv.classList.contains('is-open') ? 1 : 0;
        })(),
        chatOpen: !!(chat && chat.open),
        chatLeftPct: chat && chat.leftPct != null ? chat.leftPct : null,
        chatTopPct: chat && chat.topPct != null ? chat.topPct : null,
        chatMsgs: chat && Array.isArray(chat.msgs) ? chat.msgs : [],
        vw: vp.w,
        vh: vp.h,
        page: page,
        section: sm.section,
        device: device,
        first_load: firstLoad,
        interacted: 1,
        events: eventsToSend
      })
    }).catch(function () {});
  }

  function activeSend() { markActivity(); send(); }
  document.addEventListener('mousemove', activeSend);
  document.addEventListener('scroll', activeSend, { passive: true });
  document.addEventListener('touchmove', activeSend, { passive: true });
  document.addEventListener('touchstart', activeSend, { passive: true });
  document.addEventListener('keydown', activeSend);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) activeSend();
  });
  // Phone rotate / browser resize — flush so vw/vh land in the next snapshot
  // quickly (replay applies these dims frame-by-frame).
  var resizeFlushTimer = null;
  function onViewportChange() {
    if (resizeFlushTimer) clearTimeout(resizeFlushTimer);
    resizeFlushTimer = setTimeout(function () {
      resizeFlushTimer = null;
      if (typeof window.pfTrackFlush === 'function') window.pfTrackFlush();
      else activeSend();
    }, 120);
  }
  window.addEventListener('resize', onViewportChange);
  window.addEventListener('orientationchange', onViewportChange);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onViewportChange);
  }

  function leaveNow() {
    try {
      // Same-tab in-site navigation (Services, phobia pages, etc.): don't treat
      // as leave. The next page keeps the same vid and continues pinging.
      if (suppressLeave) return;
      // Include last ping gen so a late leave from page A cannot delete the
      // live row already rewritten by page B's newer ping (same tab).
      var payload = JSON.stringify({ vid: vid, gen: pingGen });
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/track?leave=1', new Blob([payload], { type: 'application/json' }));
      } else {
        fetch('/track?leave=1', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: payload,
          keepalive: true
        }).catch(function () {});
      }
    } catch (e) {}
  }
  // Mark impending same-origin navigations so pagehide doesn't drop the live card.
  var suppressLeave = false;
  document.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t.tagName !== 'A' && t !== document.body) t = t.parentElement;
    if (!t || t.tagName !== 'A') return;
    if (e.defaultPrevented) return;
    if (e.button != null && e.button !== 0) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (t.target && t.target !== '' && t.target !== '_self') return;
    var href = t.getAttribute('href') || '';
    if (!href || href.charAt(0) === '#' || href.indexOf('javascript:') === 0) return;
    try {
      var u = new URL(href, window.location.href);
      if (u.origin === window.location.origin) suppressLeave = true;
    } catch (err) {}
  }, true);
  window.addEventListener('pagehide', leaveNow);
  window.addEventListener('beforeunload', leaveNow);
  // When a prerendered page is actually activated (user navigates to it), reset
  // the session clock and start pinging — this is the first moment it's a real visit.
  document.addEventListener('prerenderingchange', function () {
    firstLoad = Math.floor(Date.now() / 1000);
    sendPageHit(false);
    markActivity();
    send();
  });
  // Heartbeat: keep the visitor live only while they're actually interacting.
  // Once idle past IDLE_MS, drop them (send leave once) until activity resumes.
  // Exception: an open on-site chat counts as active (iPhone keyboard otherwise
  // throttles timers and the visitor vanishes mid-conversation on /visitors).
  setInterval(function () {
    var chatOpen = false;
    try {
      var cs = typeof window.pfGetChatState === 'function' ? window.pfGetChatState() : null;
      chatOpen = !!(cs && cs.open);
    } catch (e) {}
    if (chatOpen) markActivity();
    if (Date.now() - lastActivity > IDLE_MS) {
      if (!idleLeft) { idleLeft = true; leaveNow(); }
      return;
    }
    send();
  }, 4000);
  // Always record the landing hit (Ads reconciliation). Live /visitors still
  // waits for real interaction so bots don't flood the board.
  if (!isPrerendering()) setTimeout(function () { sendPageHit(!!hasInteracted); }, 50);
  // Already proven in this tab session (came from another page) → ping ASAP.
  // First-ever landing still waits for a real interaction via the listeners above.
  if (hasInteracted) setTimeout(send, 200);
})();
</script>
