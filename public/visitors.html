:root{--teal:#1a6b72;--gold:#c9a84c;}
*{box-sizing:border-box;margin:0;padding:0;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:0.75rem 1.5rem;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0;}
.logo{font-family:'Cinzel',serif;color:var(--teal);font-size:0.95rem;}
.logo span{color:var(--gold);}
.live-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;animation:blink 2s infinite;display:inline-block;margin-right:4px;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
.btn-logout{background:none;color:#6b6b6b;border:none;font-size:0.72rem;cursor:pointer;font-family:'DM Sans',sans-serif;}
.mode-toggle{display:flex;background:#0d1117;border:1px solid #30363d;border-radius:20px;overflow:hidden;}
.mode-btn{padding:0.35rem 1.1rem;border:none;background:none;color:#6b6b6b;font-family:'DM Sans',sans-serif;font-size:0.78rem;font-weight:500;cursor:pointer;border-radius:20px;transition:all 0.2s;letter-spacing:0.03em;}
.mode-btn.active{background:var(--teal);color:#fff;}
.grid{flex:1;min-height:0;padding:1.5rem;display:flex;flex-wrap:wrap;gap:1.5rem;align-items:flex-start;overflow-y:auto;}
.visitor-card{background:#161b22;border:1px solid #30363d;border-radius:6px;overflow:visible;display:flex;flex-direction:column;transition:opacity 0.2s;}
.visitor-card.new{border-color:var(--teal);animation:glow 1.5s ease forwards;}
.visitor-card.replay-card{border-color:#555;overflow:hidden;}
.visitor-card.dragging{opacity:0.35;border-style:dashed;}
.visitor-card.drag-over{border-color:var(--teal);box-shadow:0 0 12px rgba(26,107,114,0.4);}
@keyframes glow{0%{box-shadow:0 0 20px rgba(26,107,114,0.6);}100%{box-shadow:none;}}
.card-header{padding:0.4rem 0.5rem 0.4rem 0.75rem;background:#0d1117;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:0.4rem;flex-shrink:0;}
.card-section{font-size:0.65rem;color:var(--gold);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.delete-btn{background:none;border:none;color:#444;cursor:pointer;font-size:1rem;line-height:1;padding:2px 4px;border-radius:2px;flex-shrink:0;}
.delete-btn:hover{color:#f87171;}
.cdot{width:11px;height:11px;border-radius:50%;flex-shrink:0;margin-left:3px;cursor:pointer;display:none;}
.cdot.red{display:inline-block;background:#f87171;animation:blink 1.2s infinite;}
.cdot.green{display:inline-block;background:#4caf50;animation:blink 1.2s infinite;}
.screen-wrap{position:relative;overflow:hidden;flex-shrink:0;}
.screen-iframe{border:none;transform-origin:top left;display:block;pointer-events:none;backface-visibility:hidden;-webkit-font-smoothing:antialiased;}
.replay-card .screen-iframe{/* visitor paint size + display-only CSS scale */}
.replay-card.expanded{position:relative;z-index:5;box-shadow:0 12px 48px rgba(0,0,0,0.55);}
.rpbtn.active{background:var(--teal);color:#fff;}
.cursor-dot{position:absolute;width:14px;height:14px;border:2.5px solid var(--gold);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:10;box-shadow:0 0 10px rgba(201,168,76,0.7);transition:left 0.12s ease,top 0.12s ease;}
.cursor-dot::after{content:'';position:absolute;width:4px;height:4px;background:var(--gold);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);}
.click-ripple{position:absolute;border:2px solid rgba(201,168,76,0.8);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:11;animation:ripple 0.6s ease-out forwards;}
@keyframes ripple{0%{width:10px;height:10px;opacity:1;}100%{width:40px;height:40px;opacity:0;}}
.modal-alert{position:absolute;inset:0;background:rgba(201,168,76,0.12);border:2px solid var(--gold);pointer-events:none;z-index:20;animation:mflash 1s ease forwards;}
@keyframes mflash{0%{opacity:1;}100%{opacity:0;}}
.card-footer{padding:0.4rem 0.75rem;background:#0d1117;border-top:1px solid #21262d;display:flex;align-items:center;justify-content:space-between;font-size:0.65rem;color:#6b6b6b;flex-shrink:0;}
.msg-btn{background:var(--teal);color:#fff;border:none;border-radius:3px;padding:2px 8px;font-size:0.65rem;cursor:pointer;font-family:'DM Sans',sans-serif;}
.replay-controls{padding:0.5rem 0.75rem;background:#0d1117;border-top:1px solid #21262d;display:flex;flex-direction:column;gap:0.4rem;position:relative;z-index:2;flex-shrink:0;}

.rpbtn{background:#21262d;border:none;color:#ccc;border-radius:3px;padding:2px 8px;font-size:0.65rem;cursor:pointer;font-family:'DM Sans',sans-serif;}

<body>
<div id="loginScreen">
  <div class="card">
    <div class="logo">Phobia<span>Free</span>.life</div>
    <div id="loginErr" class="err" style="display:none"></div>
    <form id="loginForm" onsubmit="return doLogin(event)">
      <label>Username</label><input type="text" id="loginUser" autofocus/>
      <label>Password</label><input type="password" id="loginPass"/>
      <button type="submit">Sign In</button>
    </form>
    <p style="text-align:center;margin-top:0.8rem;"><button type="button" onclick="showForgot()" style="background:none;border:none;color:#9ecbd0;cursor:pointer;text-decoration:underline;font-size:0.8rem;">Forgot password?</button></p>
    <form id="forgotForm" style="display:none;margin-top:0.8rem;" onsubmit="return doForgot(event)">
      <button type="submit">Send reset link (SMS)</button>
      <p style="text-align:center;margin-top:0.6rem;"><button type="button" onclick="showLoginFormOnly()" style="background:none;border:none;color:#9ecbd0;cursor:pointer;text-decoration:underline;font-size:0.8rem;">Back</button></p>
    </form>
    <form id="resetForm" style="display:none;margin-top:0.8rem;" onsubmit="return doReset(event)">
      <label>New password</label><input type="password" id="resetPass" minlength="8" required/>
      <label>Confirm</label><input type="password" id="resetPass2" minlength="8" required/>
      <button type="submit">Update password</button>
    </form>
  </div>
</div>
<div id="appShell">

<div class="topbar">
  <div style="display:flex;align-items:center;gap:1rem;">
    <div class="logo">Phobia<span>Free</span>.life</div>
    <div class="mode-toggle">
      <button class="mode-btn active" id="btnLive" onclick="setMode('live')">🟢 Live</button>
      <button class="mode-btn" id="btnReplay" onclick="setMode('replay')">📼 Replay</button>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:1rem;">
    <button id="onlineBtn" onclick="toggleOnline()" style="padding:0.4rem 1.1rem;border:none;border-radius:20px;font-family:'DM Sans',sans-serif;font-size:0.78rem;font-weight:500;cursor:pointer;background:#8b2020;color:#fff;letter-spacing:0.03em;">Offline</button>

    <button type="button" class="btn-logout" onclick="showChangePassword()">Password</button>
    <button type="button" class="btn-logout" onclick="doLogout()">Sign Out</button>
  </div>
</div>
<div id="changePasswordPanel" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:3000;align-items:center;justify-content:center;">
  <div style="background:#161b22;border:1px solid #30363d;padding:1.2rem;border-radius:6px;width:min(92vw,340px);color:#ccc;">
    <div style="margin-bottom:0.8rem;font-weight:600;">Change password</div>
    <div id="changePassErr" class="err" style="display:none"></div>
    <label>Current</label><input type="password" id="changeCurrent" style="width:100%;margin:0.3rem 0 0.6rem;padding:0.5rem;background:#0d1117;border:1px solid #30363d;color:#fff;"/>
    <label>New</label><input type="password" id="changeNew" minlength="8" style="width:100%;margin:0.3rem 0 0.6rem;padding:0.5rem;background:#0d1117;border:1px solid #30363d;color:#fff;"/>
    <label>Confirm</label><input type="password" id="changeNew2" minlength="8" style="width:100%;margin:0.3rem 0 0.8rem;padding:0.5rem;background:#0d1117;border:1px solid #30363d;color:#fff;"/>
    <div style="display:flex;gap:0.5rem;">
      <button type="button" onclick="doChangePassword()" style="padding:0.5rem 0.8rem;background:#1a6b72;color:#fff;border:none;border-radius:4px;cursor:pointer;">Save</button>
      <button type="button" onclick="hideChangePassword()" style="padding:0.5rem 0.8rem;background:#30363d;color:#fff;border:none;border-radius:4px;cursor:pointer;">Cancel</button>
    </div>
  </div>
</div>

<!-- LIVE MODE -->
<div id="liveGrid" class="grid">
  <div class="empty" id="emptyState">
    <div class="empty-icon">👁</div>
    <div style="font-size:0.88rem;">No visitors on site right now</div>
    <div style="font-size:0.75rem;color:#444;">Screens appear here when visitors arrive</div>
  </div>
</div>

<!-- REPLAY MODE -->
<div id="replayGrid" style="display:none;flex:1;flex-direction:row;min-height:0;">

  <div id="sessionList" class="session-list" style="width:260px;flex-shrink:0;background:#161b22;border-right:1px solid #30363d;overflow-y:auto;display:flex;flex-direction:column;">
    <div class="session-list-hdr">
      <div style="font-size:0.72rem;color:#6b6b6b;letter-spacing:0.08em;text-transform:uppercase;">Recorded Sessions</div>

    </div>

  <div id="replayCards" style="flex:1;padding:1.5rem;display:flex;flex-wrap:wrap;gap:1.5rem;align-items:flex-start;overflow-y:auto;min-width:0;">

</div>

// Fit live card inside the grid for *display only*.
// paintW/paintH = their real viewport (site lays out as on their device).
// cardW/cardH/scale = optical shrink onto your /visitors page only — not responsive reflow.
var LIVE_CARD_CHROME = 72; // header + footer
function liveAvail() {
  var grid = document.getElementById('liveGrid');
  var availW = 0, availH = 0;
  if (grid) {
    var cs = window.getComputedStyle(grid);
    var padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    var padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    availW = Math.floor(grid.clientWidth - padX);
    availH = Math.floor(grid.clientHeight - padY);
  }
  if (!(availW > 120)) availW = Math.max(320, window.innerWidth - 48);
  if (!(availH > 120)) availH = Math.max(240, window.innerHeight - 120);
  return { w: availW, h: availH };
}
function liveCardFit(vw, vh) {
  var paintW = Math.max(1, Math.floor(vw > 0 ? vw : 390));
  var paintH = Math.max(1, Math.floor(vh > 0 ? vh : 844));
  var a = liveAvail();
  var screenH = Math.max(80, a.h - LIVE_CARD_CHROME);
  var scale = Math.min(a.w / paintW, screenH / paintH);
  if (!(scale > 0) || !isFinite(scale)) scale = 1;
  return {
    paintW: paintW,
    paintH: paintH,
    scale: scale,
    cardW: Math.max(1, Math.floor(paintW * scale)),
    cardH: Math.max(1, Math.floor(paintH * scale))
  };
}

function replayFit(vid, vw, vh) {

}

// Iframe paints at visitor size; CSS scale only resizes the picture on /visitors.
function applyVisitorIframe(ifr, fit) {
  if (!ifr || !fit) return;
  ifr.style.width = fit.paintW + 'px';
  ifr.style.height = fit.paintH + 'px';
  ifr.style.transformOrigin = 'top left';
  ifr.style.transform = (Math.abs(fit.scale - 1) < 0.001) ? 'none' : ('scale(' + fit.scale + ')');
  ifr.style.zoom = '';
}
function applyReplayIframePaint(ifr, paintW, paintH, scale) {
  applyVisitorIframe(ifr, {
    paintW: paintW,
    paintH: paintH || Math.round(paintW * 16 / 9),
    scale: (scale != null && scale > 0) ? scale : 1
  });
}
function applyReplayIframeScale(ifr, vw, vh, cardW) {
  var paintW = Math.max(1, Math.floor(vw > 0 ? vw : 390));
  var paintH = Math.max(1, Math.floor(vh > 0 ? vh : 844));
  var scale = (cardW > 0 && paintW > 0) ? (cardW / paintW) : 1;
  applyReplayIframePaint(ifr, paintW, paintH, scale);
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btnLive').classList.toggle('active', mode==='live');
  document.getElementById('btnReplay').classList.toggle('active', mode==='replay');
  document.getElementById('liveGrid').style.display = mode==='live' ? 'flex' : 'none';
  document.getElementById('replayGrid').style.display = mode==='replay' ? 'flex' : 'none';
  document.getElementById('liveCounter').style.display = mode==='live' ? 'flex' : 'none';
  if (mode==='live') {
    Object.keys(replayState).forEach(function(vid){ closeReplayCard(vid); });
  }
  if (mode==='replay') loadSessionList();
  // Live polling keeps running in either mode — watching a replay must never
  // pause live updates or make it look like recording stopped.
}

function toggleSessionList(open) {
  var list = document.getElementById('sessionList');
  var btn = document.getElementById('sessionListOpen');
  if (!list || !btn) return;
  if (open === undefined) open = list.classList.contains('collapsed');

window.toggleSessionList = toggleSessionList;

function loadSessionList() {
  fetch('/api/sessions',{credentials:'include'}).then(function(r){return r.json();})
  .then(function(rows){
    var body = document.getElementById('sessionListBody');
    if (!rows.length) {
      body.innerHTML = '<div style="padding:2rem;text-align:center;color:#444;font-size:0.82rem;">No recordings yet.<br><span style="font-size:0.72rem;color:#333;">Sessions record as visitors browse.</span></div>';
      return;
    }
    var html = '';
    rows.forEach(function(s) {
      var mins = Math.floor(s.total_seconds/60), secs = s.total_seconds%60;
      var timeStr = mins>0 ? mins+'m '+secs+'s' : secs+'s';
      var loc = (s.location||'Unknown').replace(/,\s*[A-Z]{2},.*$/,'').replace(/,\s*[A-Z]{2}$/,'');
      var when = s.last_seen ? new Date(s.last_seen.replace(' ','T')).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '—';
      html += '<div class="session-row" id="srow_'+s.vid+'" data-vid="'+s.vid+'" onclick="loadReplay(\''+s.vid+'\',this)">'
        +'<div style="font-size:1rem;">'+devIcon(s.device)+'</div>'
        +'<div class="session-info">'
        +'<div class="session-loc">'+loc+'</div>'
        +'<div class="session-meta">'+when+' · '+timeStr+' · '+s.snap_count+' frames</div>'
        +'</div>'
        +'<button type="button" class="session-chat" data-vid="'+s.vid+'" data-label="'+String(loc).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'" title="Chat history" onclick="openSessionChat(event,this.dataset.vid,this.dataset.label)">💬</button>'
        +'<button class="session-del" title="Delete" onclick="deleteRecording(event,\''+s.vid+'\')">&times;</button>'
        +'</div>';
    });
    body.innerHTML = html;
  }).catch(function(){});
}

function placePopupFallback(vid) {
  var p = vpopups[vid];
  if (!p) return;
  var live = document.getElementById('vc_'+vid);
  var replay = document.getElementById('rvc_'+vid);
  var anchor = live || replay;
  if (anchor) {
    var r = anchor.getBoundingClientRect();
    var scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
    var pw = p.offsetWidth || 280;
    var left = r.right + 12;
    if (left + pw > window.innerWidth - 10) left = Math.max(10, r.left - pw - 12);
    p.style.top = Math.max(10, r.top + scrollY) + 'px';
    p.style.left = Math.max(10, left) + 'px';
    p.style.right = 'auto';
    p.style.bottom = 'auto';
    return;
  }
  var pw2 = p.offsetWidth || 280;
  var ph2 = p.offsetHeight || 400;
  p.style.left = Math.max(10, Math.round((window.innerWidth - pw2) / 2)) + 'px';
  p.style.top = Math.max(10, Math.round((window.innerHeight - ph2) / 2)) + 'px';
  p.style.right = 'auto';
  p.style.bottom = 'auto';
}

// Open saved chat thread for a recorded session (same vid as the recording).
function openSessionChat(e, vid, label) {
  if (e && e.stopPropagation) e.stopPropagation();
  if (e && e.preventDefault) e.preventDefault();
  if (!vid) return;
  var vs = getVS(vid);
  var p = createPopup(vid);
  p.classList.add('session-hist');
  var title = document.getElementById('ctitle_'+vid);
  if (title) {
    title.textContent = '💬 ' + (label || (replayState[vid] && replayState[vid].loc) || 'Session chat');
  }
  vs.state = 'open';
  vs.unread = 0;
  vs.dragged = false;
  vs.offline = true;
  p.classList.add('show');
  placePopupFallback(vid);
  var box = document.getElementById('cmsgs_'+vid);
  if (box) box.innerHTML = '<div style="color:#6b6b6b;font-size:0.72rem;text-align:center;padding:0.75rem;">Loading…</div>';
  vs.shownIds = {};
  vs.lastTs = 0;
  vs.bgTs = 0;
  fetch('/api/chat?vid=' + encodeURIComponent(vid) + '&since=0')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (box) box.innerHTML = '';
      if (data.messages && data.messages.length) {
        data.messages.forEach(function(m){
          if (m.id) vs.shownIds[m.id] = true;
          chatAppendMsg(vid, m);
        });
      } else if (box) {
        box.innerHTML = '<div style="color:#6b6b6b;font-size:0.75rem;text-align:center;padding:1rem;">No chat messages for this session.</div>';
      }
      vs.lastTs = data.ts || 0;
      vs.bgTs = data.ts || 0;
    })
    .catch(function(){
      if (box) box.innerHTML = '<div style="color:#f87171;font-size:0.75rem;text-align:center;padding:1rem;">Could not load chat history.</div>';
    });
}
window.openSessionChat = openSessionChat;

function deleteRecording(e, vid) {
  e.stopPropagation();
  if (!confirm('Delete this recording?')) return;
  fetch('/api/delete',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({vid:vid})}).then(function(){
    var row = document.getElementById('srow_'+vid);
    if (row) row.remove();
    closeReplayCard(vid);
  });
}

// Force all scroll-reveal content visible in a replay phobia-page iframe.
// The live pages start sections at opacity:0 and reveal them via an
// IntersectionObserver on real scroll — which never fires when we scroll
// the iframe programmatically, leaving everything below the header white.
function rForceVisibleOnce(vid) {
  try {
    var ifr = document.getElementById('rif_'+vid);
    if (!ifr) return;
    var d = ifr.contentDocument;
    if (!d) return;
    d.querySelectorAll('.problem-card, .step, .credential, .faq-item, .success-stat, .failure-card, .hero-btns, .hero-content > *')
      .forEach(function(el){ el.style.opacity = '1'; el.style.transform = 'none'; el.style.animation = 'none'; });
  } catch(e){}
}
function rForceVisible(vid) {
  // On-load version: apply now plus a few retries while images/fonts settle.
  rForceVisibleOnce(vid);
  setTimeout(function(){ rForceVisibleOnce(vid); }, 150);
  setTimeout(function(){ rForceVisibleOnce(vid); }, 500);
  setTimeout(function(){ rForceVisibleOnce(vid); }, 1000);
}

// REPLAY MAP POOL — one iframe per page, built ONCE, kept forever.
// This mirrors how LIVE mode works (load once, move the dot) instead of
// reloading the iframe on every page change (which caused white screens).
// ═══════════════════════════════════════════════════
var replayMaps = {};   // replayMaps[vid][slug] = iframe element (a "map")

// Get the map (iframe) for a given page slug, building it once if needed.
function getReplayMap(vid, slug, vw, vh) {
  if (!replayMaps[vid]) replayMaps[vid] = {};
  var pool = replayMaps[vid];
  var fit = replayFit(vid, vw, vh);
  var cardW = fit.cardW;
  var cardH = fit.cardH;
  if (pool[slug]) {
    applyVisitorIframe(pool[slug], fit);
    return pool[slug];
  }

  var sw = document.getElementById('rsw_'+vid);
  if (!sw) return null;

  var ifr = document.createElement('iframe');
  ifr.className = 'screen-iframe';
  ifr.id = 'rmap_'+vid+'_'+slug.replace(/[^a-z0-9_-]/gi,'');
  ifr.style.position = 'absolute';
  ifr.style.top = '0';
  ifr.style.left = '0';
  ifr.style.display = 'none';
  ifr.setAttribute('data-ready','0');
  ifr.setAttribute('data-slug', slug);
  applyVisitorIframe(ifr, fit);
  ifr.src = getPageUrl(slug);

  ifr.addEventListener('load', function(){
    ifr.setAttribute('data-ready','1');
    try {
      var doc = ifr.contentDocument;
      if (doc && doc.head && !doc.getElementById('pf-replay-sharp')) {
        var st = doc.createElement('style');
        st.id = 'pf-replay-sharp';
        st.textContent = 'html,body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}';
        doc.head.appendChild(st);
      }
    } catch(e){}
    if (slug === 'welcome') {
      rShowWelcomeEl(ifr);
    } else {
      rForceVisibleEl(ifr);
      setTimeout(function(){ rForceVisibleEl(ifr); }, 200);
      setTimeout(function(){ rForceVisibleEl(ifr); }, 600);
    }
  }, {once:true});

  var dot = document.getElementById('rcu_'+vid);
  if (dot) sw.insertBefore(ifr, dot); else sw.appendChild(ifr);
  pool[slug] = ifr;
  return ifr;
}

// Show one map, hide the others for this card.
function showReplayMap(vid, slug) {
  var pool = replayMaps[vid]; if (!pool) return null;
  var active = null;
  Object.keys(pool).forEach(function(s){
    if (s === slug) { pool[s].style.display = 'block'; active = pool[s]; }
    else pool[s].style.display = 'none';
  });
  return active;
}

function rForceVisibleEl(ifr) {

  } catch(e){}
}

function loadReplay(vid, rowEl) {
  // Click an already-open session again → close that replay.
  if (replayState[vid] && document.getElementById('rvc_'+vid)) {
    closeReplayCard(vid);
    return;
  }
  if (!replayAllowMultiple) {
    document.querySelectorAll('.session-row').forEach(function(r){r.classList.remove('active');});
    Object.keys(replayState).forEach(function(other) {
      if (other !== vid) closeReplayCard(other);
    });
  }

  if (replayState[vid]) {
    var existing = document.getElementById('rvc_'+vid);
    if (existing) {
      existing.scrollIntoView({behavior:'smooth',block:'start'});
      startReplayTail(vid);
      return;
    }
  }

  var token = ++replayLoadSeq;
  replayPending[vid] = token;

  fetch('/api/replay?vid='+encodeURIComponent(vid),{credentials:'include'}).then(function(r){return r.json();})
  .then(function(snaps){
    // Stale response (user switched sessions / closed) — ignore.
    if (replayPending[vid] !== token) return;
    if (!replayAllowMultiple) {
      Object.keys(replayState).forEach(function(other) {
        if (other !== vid) closeReplayCard(other);
      });
    }
    // Don't stack duplicate cards for the same session.
    if (document.getElementById('rvc_'+vid)) return;
    if (!snaps.length) { alert('No replay data for this session yet.'); return; }

    var first = snaps[0];
    var vw = first.vw || 1200;
    var vh = first.vh || 800;
    var fit = replayFit(vid, vw, vh);
    var cardW = fit.cardW;
    var scale = fit.scale;
    var dh = fit.cardH;

    var t0   = new Date(first._ts.replace(' ','T')).getTime();
    var tEnd = new Date(snaps[snaps.length-1]._ts.replace(' ','T')).getTime();
    var duration = Math.max(1000, tEnd - t0);

    // Init replay iframe tracking vars (separate from live)
    rviframePage[vid]      = first.page || 'home';
    rviframeScene[vid]     = '';
    rviframeReady[vid]     = false;
    rviframeFirstLoad[vid] = first.first_load || 0;

    var durationSec = Math.round(duration/1000);
    var dm = Math.floor(durationSec/60), ds = durationSec%60;
    var durStr = dm>0 ? dm+'m '+ds+'s' : ds+'s';
    var loc = (first.location||'Unknown').replace(/,\s*[A-Z]{2},.*$/,'').replace(/,\s*[A-Z]{2}$/,'');

    var el = document.createElement('div');
    el.className = 'visitor-card replay-card';
    el.id = 'rvc_'+vid;
    el.style.width = cardW+'px';

      +'</div>'
      +'<div class="screen-wrap" id="rsw_'+vid+'" style="width:'+cardW+'px;height:'+dh+'px;">'
      +'<div class="cursor-dot" id="rcu_'+vid+'" style="display:none;left:'+Math.round(cardW/2)+'px;top:'+Math.round(dh/2)+'px;"></div>'

      +'<span class="replay-time" id="rts_'+vid+'">'+durStr+'</span>'
      +'<button type="button" class="rpbtn replay-close" data-close-replay="'+vid+'" title="Close replay">Close</button>'
      +'</div>'

      pos: 0, playing: false, speed: 1, timer: null,
      lastSnapIdx: -1, tailTimer: null, stillLive: false,

    // Build the first map (page) via the pool, show it, then start.
    var firstSlug = first.page || 'home';

    showReplayMap(vid, firstSlug);
    document.getElementById('rcu_'+vid).style.display = 'block';
    setTimeout(function(){ replayPlay(vid); }, 600);
    // Keep pulling new frames while this visitor is still browsing — dashboard
    // Replay must not freeze/stop the session recording.
    startReplayTail(vid);

}

function closeReplayCard(vid) {
  delete replayPending[vid];
  stopReplayTail(vid);
  replayPause(vid);
  delete replayState[vid];
  delete replayMaps[vid];
  delete replayExpanded[vid];
  delete rviframePage[vid]; delete rviframeScene[vid];
  delete rviframeReady[vid]; delete rviframeFirstLoad[vid];

  document.querySelectorAll('.session-row').forEach(function(r){
    if (r.dataset.vid===vid) r.classList.remove('active');

    rc.innerHTML = '<div class="empty"><div class="empty-icon">📼</div><div style="font-size:0.88rem;">Select a session to replay</div><div style="font-size:0.75rem;color:#444;">Click any session on the left</div></div>';

// While a replay card is open, keep appending frames written by a still-live
// visitor. Watching Replay on /visitors must never freeze or stop recording.
function startReplayTail(vid) {
  stopReplayTail(vid);
  var rs = replayState[vid];
  if (!rs) return;
  rs.tailTimer = setInterval(function () { tailReplay(vid); }, 2000);
  tailReplay(vid);
}
function stopReplayTail(vid) {
  var rs = replayState[vid];
  if (!rs || !rs.tailTimer) return;
  clearInterval(rs.tailTimer);
  rs.tailTimer = null;
}
function appendReplaySnaps(vid, newSnaps) {
  var rs = replayState[vid];
  if (!rs || !newSnaps || !newSnaps.length) return 0;
  var lastTs = rs.snaps.length ? rs.snaps[rs.snaps.length - 1]._ts : '';
  var added = 0;
  for (var i = 0; i < newSnaps.length; i++) {
    var s = newSnaps[i];
    if (!s || !s._ts || (lastTs && s._ts <= lastTs)) continue;
    rs.snaps.push(s);
    lastTs = s._ts;
    added++;
  }
  if (!added) return 0;
  var tEnd = new Date(rs.snaps[rs.snaps.length - 1]._ts.replace(' ', 'T')).getTime();
  var wasAtEnd = rs.pos >= rs.duration - 80;
  rs.duration = Math.max(1000, tEnd - rs.t0);
  var durationSec = Math.round(rs.duration / 1000);
  var dm = Math.floor(durationSec / 60), ds = durationSec % 60;
  var durStr = dm > 0 ? dm + 'm ' + ds + 's' : ds + 's';
  var rts = document.getElementById('rts_' + vid);
  if (rts) rts.textContent = durStr + (rs.stillLive ? ' · REC' : '');
  // If playback had reached the old end, keep rolling into the new frames.
  if (wasAtEnd && rs.playing) rs.pos = Math.min(rs.pos, rs.duration);
  return added;
}
function updateReplayLiveBadge(vid, live) {

  var hdr = document.getElementById('rcs_' + vid);

  var rts = document.getElementById('rts_' + vid);
  if (rts) {
    var durationSec = Math.round(rs.duration / 1000);
    var dm = Math.floor(durationSec / 60), ds = durationSec % 60;
    var durStr = dm > 0 ? dm + 'm ' + ds + 's' : ds + 's';
    rts.textContent = live ? durStr + ' · REC' : durStr;
  }
}
function tailReplay(vid) {
  var rs = replayState[vid];
  if (!rs) return;
  var after = rs.snaps.length ? rs.snaps[rs.snaps.length - 1]._ts : '';
  var url = '/api/replay?vid=' + encodeURIComponent(vid);
  if (after) url += '&after=' + encodeURIComponent(after);
  fetch(url, { credentials: 'include' })
    .then(function (r) { return r.json(); })
    .then(function (snaps) {
      if (Array.isArray(snaps) && snaps.length) appendReplaySnaps(vid, snaps);
    })
    .catch(function () {});

    .then(function (r) { return r.json(); })
    .then(function (data) {
      updateReplayLiveBadge(vid, !!(data && data[vid]));
    })
    .catch(function () {});
}

function replayPlay(vid) {
  var rs = replayState[vid]; if (!rs || rs.playing) return;
  rs.playing = true;
  var TICK = 50;
  rs.timer = setInterval(function(){
    if (!rs.playing) { clearInterval(rs.timer); return; }
    rs.pos += TICK * rs.speed;
    if (rs.pos >= rs.duration) { rs.pos = rs.duration; rs.playing = false; clearInterval(rs.timer); }
    renderReplayFrame(vid);
  }, TICK);
}

function replayPause(vid) {
  var rs = replayState[vid]; if (!rs) return;
  rs.playing = false;
  if (rs.timer) { clearInterval(rs.timer); rs.timer = null; }
}

function replayRestart(vid) {
  replayPause(vid);
  var rs = replayState[vid]; if (!rs) return;
  rs.pos = 0; rs.lastSnapIdx = -1;
  var snap = rs.snaps[0];
  var firstPage = snap ? (snap.page || 'home') : 'home';
  rviframePage[vid] = firstPage;
  rviframeScene[vid] = '';
  // Pool handles the map — just show the first page's map again. No reload.
  var vw = snap ? (snap.vw || 1200) : 1200;
  var vh = snap ? (snap.vh || 800) : 800;
  getReplayMap(vid, firstPage, vw, vh);
  showReplayMap(vid, firstPage);
  document.getElementById('rcu_'+vid).style.display = 'block';
  renderReplayFrame(vid);
  replayPlay(vid);
}

function scrubReplay(vid, val) {

  rs.pos = (val / 10000) * rs.duration;
  renderReplayFrame(vid);

function toggleSpeed(vid) {

  }

function renderReplayFrame(vid) {
  var rs = replayState[vid]; if (!rs || !rs.snaps.length) return;

  // Find current snapshot
  var currentT = rs.t0 + rs.pos;
  var snapIdx = 0;
  for (var i = 0; i < rs.snaps.length; i++) {
    var st = new Date(rs.snaps[i]._ts.replace(' ','T')).getTime();
    if (st <= currentT) snapIdx = i;
    else break;
  }
  var snap = rs.snaps[snapIdx];
  var vw = snap.vw || 1200;
  var vh = snap.vh || 800;
  var fit = replayFit(vid, vw, vh);
  var cardW = fit.cardW;
  var scale = fit.scale;
  var dh = fit.cardH;
  var pageSlug = snap.page || 'home';

  // Apply recorded viewport changes (e.g. phone rotate).
  if (Math.abs((rs.lastVw || 0) - vw) > 30 || Math.abs((rs.lastVh || 0) - vh) > 30 || rs.lastCardW !== cardW) {
    updateReplayCardDims(vid, vw, vh);
    rs.lastVw = vw;
    rs.lastVh = vh;
    rs.lastCardW = cardW;
  }

  // ── Map (page) selection — the friend-on-the-map model ──
  // Get this page's map (built once, kept forever), show it, hide the others.
  // Building a not-yet-seen map loads it in the background; the visible map is
  // never reloaded, so the view never goes white on a page change.
  var iframe = getReplayMap(vid, pageSlug, vw, vh);
  if (pageSlug !== rviframePage[vid]) {
    rviframePage[vid] = pageSlug;
    rviframeScene[vid] = '';
  }
  showReplayMap(vid, pageSlug);
  var mapReady = iframe && iframe.getAttribute('data-ready') === '1';

  // ── Welcome scene mirroring (on the welcome map) ──
  if (pageSlug === 'welcome' && snap.section && mapReady) {
    if (rviframeScene[vid] !== snap.section) {
      rviframeScene[vid] = snap.section;
      rMirrorWelcomeEl(iframe, snap.section);
    }
    rShowWelcomeEl(iframe);
  }

  // ── Phobia page: keep scroll-reveal sections visible (cheap, every frame) ──
  if (pageSlug !== 'welcome' && mapReady) {
    rForceVisibleEl(iframe);
  }

  // ── Scroll the visible map to the recorded position ──
  if (mapReady && pageSlug !== 'welcome' && iframe.contentWindow) {
    try {
      var rdoc = iframe.contentDocument;
      var rModal = rdoc && rdoc.getElementById('consultModal');
      // Mirror FAQ accordion state from the snapshot (same as live view).
      mirrorFaqState(rdoc, snap.openFaqs);
      var rBox = (snap.modalScroll || snap.section === 'consult-modal' || (rModal && rModal.classList.contains('active')))
        ? rdoc.querySelector('#consultModal .modal-box')
        : null;
      if (rBox) {
        var msh = rBox.scrollHeight - rBox.clientHeight;
        if (msh > 10) {
          rBox.scrollTop = snap.scrollPct != null ? Math.round(snap.scrollPct * msh) : (snap.scrollY || 0);
        }
      } else {
        var sh = rdoc.documentElement.scrollHeight;
        if (sh > 100) {
          var scrollableH = sh - iframe.clientHeight;
          var target = snap.scrollPct != null ? Math.round(snap.scrollPct * scrollableH) : (snap.scrollY || 0);
          iframe.contentWindow.scrollTo(0, target);
        }
      }
    } catch(e){}
  }

  // ── Mirror visitor chat on every page (including welcome) ──
  if (mapReady && iframe && iframe.contentDocument) {
    try { mirrorChatState(iframe.contentDocument, snap); } catch(e){}
  }

  // ── Cursor ──
  var cu = document.getElementById('rcu_'+vid);
  if (cu) {
    cu.style.display = 'block';
    cu.style.left = Math.round(snap.x * cardW) + 'px';
    cu.style.top  = Math.round(snap.y * dh) + 'px';
  }

  // ── Click events — only fire on new snapshots ──
  if (snapIdx !== rs.lastSnapIdx && snap.events && snap.events.length) {
    snap.events.forEach(function(ev){
      if (ev.type === 'click') {
        // Ripple
        var sw = document.getElementById('rsw_'+vid);
        if (sw) {
          var rip = document.createElement('div');
          rip.className = 'click-ripple';
          rip.style.left = Math.round(ev.x * cardW) + 'px';
          rip.style.top  = Math.round(ev.y * dh) + 'px';
          if (ev.modal) {
            rip.style.border = '3px solid #fff';
            rip.style.boxShadow = '0 0 20px rgba(201,168,76,0.9)';
            var fl = document.createElement('div');
            fl.className = 'modal-alert';
            sw.appendChild(fl);
            setTimeout(function(){ if(fl.parentNode) fl.parentNode.removeChild(fl); }, 1000);
          }

          setTimeout(function(){ if(rip.parentNode) rip.parentNode.removeChild(rip); }, 800);

        // ── Open modal in iframe if it was a modal click ──

        }

  }
  rs.lastSnapIdx = snapIdx;

  // ── Scrubber ──
  var scrub = document.getElementById('rsc_'+vid);
  if (scrub) scrub.value = Math.round((rs.pos / rs.duration) * 10000);

  // ── Time ──
  var tm = document.getElementById('rtm_'+vid);
  if (tm) {
    var cur = Math.round(rs.pos/1000), tot = Math.round(rs.duration/1000);
    var cm=Math.floor(cur/60),cs=cur%60,tm2=Math.floor(tot/60),ts2=tot%60;
    tm.textContent = (cm>0?cm+'m ':'')+cs+'s / '+(tm2>0?tm2+'m ':'')+ts2+'s';
  }

  // ── Section label ──
  var lbl = document.getElementById('rcs_'+vid);
  if (lbl && snap.section) {
    var sl = pageSlug==='welcome' ? welcomeSceneLabel(snap.section) : (sectionLabels[snap.section]||snap.section);
    lbl.textContent = '📼 '+devIcon(snap.device||'')+' '+sl;
  }
}

  var btn=doc.getElementById('liveBtn');
  var open=!!d.chatOpen;
  win.style.display=open?'flex':'none';
  if(btn)btn.style.display=open?'none':'block';
  if(!open)return;
  var iw=(doc.defaultView&&doc.defaultView.innerWidth)||390;
  var ih=(doc.defaultView&&doc.defaultView.innerHeight)||800;
  if(d.chatLeftPct!=null&&d.chatTopPct!=null&&isFinite(d.chatLeftPct)&&isFinite(d.chatTopPct)){
    win.style.left=Math.round(d.chatLeftPct*iw)+'px';
    win.style.top=Math.round(d.chatTopPct*ih)+'px';
    win.style.right='auto';
    win.style.bottom='auto';
  }else{
    win.style.left='';
    win.style.top='';
    win.style.right='1.75rem';
    win.style.bottom='1.75rem';
  }
  var input=doc.getElementById('textChatInput');
  if(input){input.disabled=true;input.placeholder='(visitor chat)';}
  var box=doc.getElementById('textChatMessages');
  if(!box)return;
  var msgs=Array.isArray(d.chatMsgs)?d.chatMsgs:[];
  var sig='';
  try{sig=JSON.stringify(msgs);}catch(e){sig=String(msgs.length);}
  if(box.getAttribute('data-mirror-sig')===sig)return;
  box.setAttribute('data-mirror-sig',sig);
  box.innerHTML='';
  for(var i=0;i<msgs.length;i++){
    var m=msgs[i]||{};
    var from=m.from==='visitor'?'visitor':'steven';
    var type=m.type||'text';
    var isSteven=from==='steven';
    var div=doc.createElement('div');
    if(type==='image'&&m.url){
      div.style.cssText='max-width:80%;padding:4px;border-radius:10px;'+(isSteven?'background:#e8f4f5;align-self:flex-start;border-radius:12px 12px 12px 2px;':'background:#124d52;align-self:flex-end;margin-left:auto;border-radius:12px 12px 2px 12px;');
      div.innerHTML=(isSteven?'<div style="font-size:0.72rem;color:#6b6b6b;margin:2px 6px 4px;">Steven sent a photo</div>':'')
        +'<img src="'+String(m.url).replace(/"/g,'&quot;')+'" alt="" style="max-width:160px;border-radius:7px;display:block;">';
    }else if((type==='file'||type==='link'||type==='chat_link')&&m.url){
      div.style.cssText='max-width:90%;padding:0.5rem 0.75rem;border-radius:12px;font-size:0.82rem;'+(isSteven?'background:#e8f4f5;color:#124d52;align-self:flex-start;':'background:#124d52;color:#fff;align-self:flex-end;margin-left:auto;');
      div.innerHTML=(isSteven?'<div style="font-size:0.72rem;color:#6b6b6b;margin-bottom:4px;">Steven shared:</div>':'')
        +'<a href="'+String(m.url).replace(/"/g,'&quot;')+'" target="_blank" rel="noopener" style="color:inherit;">'+(m.text||'link')+'</a>';
    }else{
      div.style.cssText='max-width:85%;padding:0.5rem 0.75rem;border-radius:12px;font-size:0.82rem;line-height:1.5;word-break:break-word;'
        +(isSteven?'background:#e8f4f5;color:#124d52;border-radius:12px 12px 12px 2px;align-self:flex-start;':'background:#124d52;color:#fff;border-radius:12px 12px 2px 12px;align-self:flex-end;margin-left:auto;');
      div.textContent=m.text||'';
    }
    box.appendChild(div);
  }
  box.scrollTop=box.scrollHeight;
}
function poll(){
  // Always poll live visitors — even while the Replay tab is showing.
  // Recording itself is server-side; this just keeps the live view current so
  // switching back from Replay never looks like the session died.
  fetch('/track').then(function(r){return r.json();}).then(function(data){
    var grid=document.getElementById('liveGrid');var vids=Object.keys(data);
    var countEl=document.getElementById('countDisplay');
    if(countEl)countEl.textContent=vids.length;
    if(currentMode==='live'){
      document.getElementById('emptyState').style.display=vids.length===0?'flex':'none';
    }
    Object.keys(vstate).forEach(function(vid){if(!data[vid]&&vstate[vid].state!=='closed')chatSoftOffline(vid);});
    vids.forEach(function(vid){
      if(hiddenVids.has(vid))return;
      var dSlug = data[vid].page || 'home';
      if(!vcards[vid]){vcards[vid]='pending';getVS(vid);var card=makeCard(vid,data[vid]);grid.appendChild(card);vcards[vid]=card;vdata[vid]={vw:0,vh:0};}
      if(vcards[vid]==='pending')return;
      chatSoftOnline(vid,data[vid]);
      var prev=vdata[vid]||{};
      if(Math.abs((prev.vw||0)-data[vid].vw)>30||Math.abs((prev.vh||0)-data[vid].vh)>30){if(prev.vw)updateCardDims(vid,data[vid]);}
      updateCard(vid,data[vid]);vdata[vid]=data[vid];
    });
    Object.keys(vcards).forEach(function(vid){if(hiddenVids.has(vid)||vcards[vid]==='pending')return;if(!data[vid]){chatSoftOffline(vid);var c=vcards[vid];if(c&&c!=='pending'){c.style.opacity='0';c.style.transition='opacity 0.3s';setTimeout(function(){if(c.parentNode)c.parentNode.removeChild(c);},300);}delete vcards[vid];delete vdata[vid];}});
    Object.keys(vstate).forEach(function(vid){var vs=vstate[vid];if(vs&&vs.state==='open'&&!vs.dragged&&data[vid])placePopup(vid);});
  }).catch(function(){});
}
function applyBgMessages(vid,vs,data){
  if(data.ts)vs.bgTs=data.ts;
  if(!data.messages||!data.messages.length)return;
  var newVisitor=0;
  // Ensure a popup exists when we need to render (keeps iPhone SMS replies visible
  // even if the live card briefly disappeared).
  var needBox=false;
  data.messages.forEach(function(m){
    if(m.id&&vs.shownIds[m.id])return;
    needBox=true;
  });
  if(needBox&&(vs.state==='open'||vs.state==='mini')&&!document.getElementById('cmsgs_'+vid)){
    createPopup(vid);
    if(vs.state==='open'){var p=vpopups[vid];if(p)p.classList.add('show');}
  }
  data.messages.forEach(function(m){
    if(m.id&&vs.shownIds[m.id])return;      // already displayed (our own send or prior fetch)
    if(m.id)vs.shownIds[m.id]=true;
    if(m.from==='steven'){                    // a reply made elsewhere (Steven's iPhone) -> mirror, labeled
      if(m.url)chatAppendMsg(vid,m);else chatAppendPhone(vid,m.text||'');
    }else{                                     // visitor message -> notify + badge + chime
      chatAppendMsg(vid,m);
      newVisitor++;
    }
  });
  if(newVisitor>0){vs.unread+=newVisitor;refreshBadge(vid);setDot(vid,'red');chime();}
}
function pollBg(){
  // Poll live cards AND any open/mini chat whose visitor dropped off live.
  var vids={};
  Object.keys(vdata).forEach(function(vid){vids[vid]=1;});
  Object.keys(vstate).forEach(function(vid){
    if(vstate[vid]&&(vstate[vid].state==='open'||vstate[vid].state==='mini'))vids[vid]=1;
  });
  Object.keys(vids).forEach(function(vid){
    if(hiddenVids.has(vid))return;var vs=getVS(vid);
    if(vs.bgTs===0){
      // Prime: record existing history as already-seen so it isn't replayed as "new".
      fetch('/api/chat?vid='+vid+'&since=0').then(function(r){return r.json();}).then(function(data){
        vs.bgTs=data.ts||Math.floor(Date.now()/1000);
        if(data.messages)data.messages.forEach(function(m){if(m.id)vs.shownIds[m.id]=true;});
      }).catch(function(){vs.bgTs=Math.floor(Date.now()/1000);});
      return;
    }
    fetch('/api/chat?vid='+vid+'&since='+vs.bgTs).then(function(r){return r.json();}).then(function(data){
      applyBgMessages(vid,vs,data);
    }).catch(function(){});
  });
}
document.getElementById('liveGrid').addEventListener('dragstart',function(e){var c=e.target.closest('.visitor-card');if(!c)return;dragCard=c;setTimeout(function(){c.classList.add('dragging');},0);});
document.getElementById('liveGrid').addEventListener('dragend',function(){if(dragCard){dragCard.classList.remove('dragging');dragCard=null;}document.querySelectorAll('.visitor-card').forEach(function(c){c.classList.remove('drag-over');});});
document.getElementById('liveGrid').addEventListener('dragover',function(e){e.preventDefault();var c=e.target.closest('.visitor-card');if(!c||c===dragCard)return;document.querySelectorAll('.visitor-card').forEach(function(x){x.classList.remove('drag-over');});c.classList.add('drag-over');var g=document.getElementById('liveGrid');if(e.clientX<c.getBoundingClientRect().left+c.offsetWidth/2)g.insertBefore(dragCard,c);else g.insertBefore(dragCard,c.nextSibling);});
document.getElementById('liveGrid').addEventListener('click',function(e){
  var del=e.target.closest('.delete-btn');if(del){var vid=del.dataset.vid;hiddenVids.add(vid);chatClose(vid);var card=vcards[vid];if(card&&card!=='pending'){card.style.opacity='0';card.style.transition='opacity 0.3s';setTimeout(function(){if(card.parentNode)card.parentNode.removeChild(card);},300);}delete vcards[vid];return;}
  var msg=e.target.closest('.msg-btn');if(msg)chatOpen(msg.dataset.vid);
});
document.getElementById('replayCards').addEventListener('click',function(e){
  var btn=e.target.closest('[data-close-replay]');
  if(!btn)return;
  e.preventDefault();
  e.stopPropagation();
  closeReplayCard(btn.getAttribute('data-close-replay'));
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape'||currentMode!=='replay')return;
  var vids=Object.keys(replayState);
  if(vids.length)closeReplayCard(vids[0]);
});

fetch('/api/chat/status',{credentials:'include'}).then(function(r){return r.json();}).then(function(d){
  var on=(d.status==='online'||d.status==='online_cam');
  isOnline=on;
  var b=document.getElementById('onlineBtn');
  if(!b)return;
  if(on){b.textContent='Online';b.style.background='#1a6b72';}else{b.textContent='Offline';b.style.background='#8b2020';}
}).catch(function(){});
poll();
setInterval(poll,800);
setInterval(pollBg,1000);
var liveResizeTimer=null;
window.addEventListener('resize',function(){
  if(liveResizeTimer)clearTimeout(liveResizeTimer);
  liveResizeTimer=setTimeout(function(){
    Object.keys(vdata).forEach(function(vid){
      if(vdata[vid]&&vcards[vid]&&vcards[vid]!=='pending')updateCardDims(vid,vdata[vid]);
    });
    Object.keys(replayState).forEach(function(vid){
      var rs=replayState[vid];
      if(rs){rs.lastCardW=null;updateReplayCardDims(vid,rs.lastVw||390,rs.lastVh||844);}
    });
  },100);
});
setInterval(function(){Object.keys(vdata).forEach(function(vid){var el=document.getElementById('ct_'+vid);if(el&&vdata[vid])el.textContent=elapsed(vdata[vid].first);});},1000);
var isOnline=false;
var IDLE_MS=60000;
var idleTimer=null;
var hiddenTimer=null;
var heartbeatTimer=null;
function toggleOnline(){isOnline?goOffline():goOnline();}
function goOnline(){isOnline=true;var b=document.getElementById('onlineBtn');b.textContent='Online';b.style.background='#1a6b72';setStatus('online_cam');resetIdleTimer();clearInterval(heartbeatTimer);heartbeatTimer=setInterval(function(){if(isOnline)setStatus('online_cam');},20000);}
function goOffline(){isOnline=false;clearTimeout(idleTimer);idleTimer=null;clearTimeout(hiddenTimer);hiddenTimer=null;clearInterval(heartbeatTimer);heartbeatTimer=null;var b=document.getElementById('onlineBtn');if(b){b.textContent='Offline';b.style.background='#8b2020';}setStatus('offline');}
function setStatus(s){fetch('/api/chat/status',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})}).catch(function(){});}
function resetIdleTimer(){
  clearTimeout(idleTimer);
  idleTimer=null;
  if(!isOnline)return;
  idleTimer=setTimeout(function(){goOffline();},IDLE_MS);
}
['mousemove','mousedown','keydown','touchstart','scroll','click','wheel'].forEach(function(ev){
  document.addEventListener(ev,function(){if(isOnline)resetIdleTimer();},{passive:true});
});
document.addEventListener('visibilitychange',function(){
  clearTimeout(hiddenTimer);
  hiddenTimer=null;
  if(document.hidden){
    if(isOnline)hiddenTimer=setTimeout(function(){goOffline();},IDLE_MS);
  }else if(isOnline){
    resetIdleTimer();
  }
});
function forceOfflineBeacon(){
  if(!isOnline)return;
  isOnline=false;
  try{
    if(navigator.sendBeacon){
      navigator.sendBeacon('/api/chat/status',new Blob([JSON.stringify({status:'offline'})],{type:'application/json'}));
      return;
    }
  }catch(e){}
  setStatus('offline');
}
window.addEventListener('pagehide',forceOfflineBeacon);
window.addEventListener('beforeunload',forceOfflineBeacon);
</script>

</div>
<script>
var API_OPTS = {credentials:'include'};
function showApp(){
  document.getElementById('loginScreen').style.display='none';
  var app=document.getElementById('appShell');
  app.style.display='flex';
}
async function checkAuth(){
  try{
    var r=await fetch('/api/sessions',API_OPTS);
    if(r.ok){showApp();return true;}
  }catch(e){}
  return false;
}
var resetToken=new URLSearchParams(window.location.search).get('reset')||'';
function showLoginFormOnly(){document.getElementById('loginForm').style.display='';document.getElementById('forgotForm').style.display='none';document.getElementById('resetForm').style.display='none';}
function showForgot(){document.getElementById('loginForm').style.display='none';document.getElementById('forgotForm').style.display='block';document.getElementById('resetForm').style.display='none';}
function showResetForm(){document.getElementById('loginForm').style.display='none';document.getElementById('forgotForm').style.display='none';document.getElementById('resetForm').style.display='block';}
async function doLogin(e){
  e.preventDefault();
  var err=document.getElementById('loginErr');
  err.style.display='none';
  var r=await fetch('/api/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('loginUser').value,password:document.getElementById('loginPass').value})});
  var d=await r.json().catch(function(){return {};});
  if(!r.ok){err.textContent=d.error||'Invalid credentials.';err.style.display='block';return false;}
  showApp();
  return false;
}
async function doForgot(e){
  e.preventDefault();
  var err=document.getElementById('loginErr');err.style.display='none';
  var r=await fetch('/api/forgot-password',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:'visitors'})});
  var d=await r.json().catch(function(){return {};});
  err.textContent=r.ok?(d.message||'Sent.'):(d.error||'Failed');err.style.display='block';err.style.color=r.ok?'#4caf50':'';
  return false;
}
async function doReset(e){
  e.preventDefault();
  var err=document.getElementById('loginErr');err.style.display='none';
  var p1=document.getElementById('resetPass').value,p2=document.getElementById('resetPass2').value;
  if(p1!==p2){err.textContent='Passwords do not match.';err.style.display='block';return false;}
  var r=await fetch('/api/reset-password',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:resetToken,password:p1})});
  var d=await r.json().catch(function(){return {};});
  if(!r.ok){err.textContent=d.error||'Failed';err.style.display='block';return false;}
  history.replaceState({},'','/visitors.html');showApp();return false;
}
function showChangePassword(){document.getElementById('changePasswordPanel').style.display='flex';}
function hideChangePassword(){document.getElementById('changePasswordPanel').style.display='none';}
async function doChangePassword(){
  var err=document.getElementById('changePassErr');err.style.display='none';
  var p1=document.getElementById('changeNew').value,p2=document.getElementById('changeNew2').value;
  if(p1!==p2){err.textContent='Passwords do not match.';err.style.display='block';return;}
  var r=await fetch('/api/change-password',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword:document.getElementById('changeCurrent').value,newPassword:p1})});
  var d=await r.json().catch(function(){return {};});
  if(!r.ok){err.textContent=d.error||'Failed';err.style.display='block';return;}
  hideChangePassword();
}
async function doLogout(){
  await fetch('/api/logout',{method:'POST',credentials:'include'});
  location.reload();
}
if(resetToken){showResetForm();}else{checkAuth();}
</script>
